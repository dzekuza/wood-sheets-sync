<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Europa Floor Plan</title>
    <style>
      :root {
        color-scheme: light;
        background: #f6f7f8;
        color: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 1240px);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        background: white;
        border: 1px solid #e5e7eb;
        box-shadow: 0 18px 55px rgb(17 24 39 / 10%);
      }
    </style>
  </head>
  <body>
    <main>
      <a href="./europa-floor-plan.svg" aria-label="Open standalone SVG floor plan">
        <img src="./europa-floor-plan-reference.jpg" alt="Europa shopping center floor plan" />
      </a>
    </main>
  </body>
</html>
